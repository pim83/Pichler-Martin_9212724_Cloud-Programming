{% extends 'base.html' %}{% block content %}
<h1>Zugang zum Prüfstand-Dashboard</h1>
<p>Bitte gib das Projektpasswort ein, um die Messergebnisse anzusehen.</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('login') }}">
<input type="hidden" name="csrf" value="{{ session.csrf }}">
<label>Passwort<input type="password" name="password" autocomplete="current-password" required maxlength="256"></label>
<button type="submit">Anmelden</button>
</form>
{% endblock %}
