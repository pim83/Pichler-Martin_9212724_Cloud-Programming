<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prüfstand · Messungsübersicht</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><a class="brand" href="/">Prüfstand <span>Monitoring</span></a>
